<div class="grid grid-flow-col gap-12 whitespace-nowrap">
  @for (item of items; track item.path; let i = $index) {
    <a
    #rla="routerLinkActive"
    routerLinkActive
    [routerLink]="item.path"
    [routerLinkActiveOptions]="{ exact: true }"
    [ngClass]="rla.isActive ? 'text-black font-bold' : 'text-gray-400'"
    [style.gridColumn]="startColumn + i"
  >
    {{ item.label }}
  </a>
  }
</div>
