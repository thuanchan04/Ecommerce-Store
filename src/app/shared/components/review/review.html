<p class="text-2xl py-10 px-20">Reviews</p>
<div class="flex flex-row px-20 gap-16 flex-wrap">

  <!-- Left: score card -->
  <div class="flex flex-col items-center gap-2 bg-gray-50 rounded-2xl p-6 min-w-[140px]">
    <p class="text-6xl font-semibold">{{ avgDisplay() }}</p>
    <p class="text-gray-400 text-sm text-center">of {{ total() }} reviews</p>

    <!-- Stars with precise partial fill using clip-path -->
    <div class="flex items-center gap-0.5 mt-1">
      @for (fill of starFills(); track $index) {
        <div class="relative w-5 h-5">
          <!-- Grey base star -->
          <app-icon [icon]="Icons.STAR_WHITE" class="absolute inset-0 w-5 h-5"></app-icon>
          <!-- Gold fill clipped to percentage -->
          @if (fill > 0) {
            <div
              class="absolute inset-0 overflow-hidden"
              [style.width.%]="fill"
            >
              <app-icon [icon]="Icons.STAR_YELLOW" class="w-5 h-5 block"></app-icon>
            </div>
          }
        </div>
      }
    </div>
  </div>

  <!-- Right: breakdown bars -->
  <div class="flex flex-col gap-3 flex-1 min-w-[200px]">
    @for (star of [5, 4, 3, 2, 1]; track star) {
      <div class="flex items-center gap-3">
        <span class="text-sm font-medium w-28 shrink-0">{{ getLabel(star) }}</span>
        <div class="relative flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
          <div
            class="absolute inset-y-0 left-0 bg-amber-400 rounded-full"
            [style.width.%]="getLinePercent(star)">
          </div>
        </div>
        <span class="text-sm text-gray-400 w-6 text-right shrink-0">{{ getQuantity(star) }}</span>
      </div>
    }
  </div>

</div>

<!-- Leave Comment placeholder -->
<div class="px-20 mt-6">
  <p class="text-sm text-gray-400 cursor-pointer hover:text-gray-700">Leave Comment</p>
</div>

<input type="text" placeholder="Leave Comment" class="mt-10 mx-20 p-4 my-5 w-[80%] border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-gray-400" />
