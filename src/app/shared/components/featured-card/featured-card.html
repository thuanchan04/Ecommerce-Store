<div class="border border-gray-100 shadow-md rounded-md p-4 h-full relative flex flex-col justify-between items-center transition-all duration-700 ease-in-out"
  [ngClass]="currentColor()"
  >
  <app-img-products [ImgProductsType]="featureImage"></app-img-products>
  <span class="font-thin text-2xl">{{ featureName }}</span>
  <p>{{ featureDescription }}</p>
  <app-button label="Shop Now" variant="black" size="S" class="px-20" routerLink="/products"></app-button>
</div>
