<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md flex flex-col gap-6">

    <!-- Logo + Title -->
    <div class="flex flex-col items-center gap-3">
      <app-logo [logoType]="LogoTypes.DARK"></app-logo>
      <h1 class="text-2xl font-bold">Welcome back</h1>
      <p class="text-gray-500 text-sm">Sign in to your E-Store account</p>
    </div>

    <!-- Error -->
    @if (errorMessage()) {
      <div class="bg-red-50 border border-red-200 text-red-600 rounded-lg px-4 py-3 text-sm">
        {{ errorMessage() }}
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onLogin()" class="flex flex-col gap-5">
      <!-- Email -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700" for="email">Email Address</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Enter your email"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-black"
        />
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700" for="password">Password</label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            required
            placeholder="Enter your password"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-black"
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700 cursor-pointer"
            (click)="togglePasswordVisibility()"
          >{{ showPassword() ? '🙈' : '👁️' }}</button>
        </div>
      </div>

      <!-- Remember me -->
      <label class="flex items-center gap-3 cursor-pointer text-sm text-gray-600">
        <input
          type="checkbox"
          name="rememberMe"
          [(ngModel)]="rememberMe"
          class="w-4 h-4 rounded border-gray-300 accent-black cursor-pointer"
        />
        Remember me
      </label>

      <!-- Submit -->
      <button
        type="submit"
        class="bg-black text-white rounded-lg py-3 font-medium hover:bg-gray-800 transition-colors cursor-pointer"
      >Sign In</button>
    </form>

    <!-- Register link -->
    <p class="text-center text-sm text-gray-500">
      Don't have an account?
      <a routerLink="/register" class="text-black font-semibold hover:underline">Create one</a>
    </p>

  </div>
</div>
