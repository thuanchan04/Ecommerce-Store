<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md flex flex-col gap-6">

    <!-- Logo + Title -->
    <div class="flex flex-col items-center gap-3">
      <app-logo [logoType]="LogoTypes.DARK"></app-logo>
      <h1 class="text-2xl font-bold">Create Account</h1>
      <p class="text-gray-500 text-sm">Join E-Store today</p>
    </div>

    <!-- Error -->
    @if (errorMessage()) {
      <div class="bg-red-50 border border-red-200 text-red-600 rounded-lg px-4 py-3 text-sm">
        {{ errorMessage() }}
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onRegister()" class="flex flex-col gap-5">
      <!-- Name -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700" for="reg-name">Full Name</label>
        <input
          id="reg-name"
          type="text"
          name="name"
          [(ngModel)]="name"
          required
          placeholder="Enter your full name"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-black"
        />
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700" for="reg-email">Email Address</label>
        <input
          id="reg-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Enter your email"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-black"
        />
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700" for="reg-password">Password</label>
        <div class="relative">
          <input
            id="reg-password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            required
            placeholder="At least 6 characters"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-black"
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700 cursor-pointer"
            (click)="togglePasswordVisibility()"
          >{{ showPassword() ? '🙈' : '👁️' }}</button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700" for="reg-confirm">Confirm Password</label>
        <input
          id="reg-confirm"
          [type]="showPassword() ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          placeholder="Re-enter your password"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-black"
        />
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="bg-black text-white rounded-lg py-3 font-medium hover:bg-gray-800 transition-colors cursor-pointer"
      >Create Account</button>
    </form>

    <!-- Login link -->
    <p class="text-center text-sm text-gray-500">
      Already have an account?
      <a routerLink="/login" class="text-black font-semibold hover:underline">Sign in</a>
    </p>

  </div>
</div>
