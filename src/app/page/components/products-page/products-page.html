<app-header-top class="fixed top-0 left-0 z-50 w-full"></app-header-top>

<div class="px-10 min-h-screen">
  <!-- Breadcrumb -->
  <div class="mt-20 px-13 py-6 text-gray-500">
    <a routerLink="/home" class="hover:text-black">Home</a>
    <span> › </span>
    <a routerLink="/products" class="hover:text-black">Catalog</a>
    <span> › </span>
    <span class="text-black font-medium">
      {{ currentCategoryName() }}
    </span>
  </div>

  <!-- Layout -->
  <div class="grid grid-cols-4 gap-6 px-10 pb-10">

    <!-- LEFT FILTER SIDEBAR -->
    <div class="col-span-1">
      <app-filter-sidebar
        [filters]="filters"
        [products]="products()"
        (filterChange)="onFilterChange($event)">
      </app-filter-sidebar>
    </div>

    <!-- RIGHT PRODUCTS -->
    <div class="col-span-3">

      <div class="flex justify-between items-center">

        <!-- LEFT -->
        <div class="flex gap-2">
          <p class="text-gray-500">Selected Products:</p>
          <p class="font-bold">{{ filteredProducts().length }}</p>
        </div>

        <!-- RIGHT -->
        <app-drop-down
          [options]="sortOptions"
          [selectedOption]="sortOption()"
          (selectedOptionChange)="onSortChange($event)">
        </app-drop-down>

      </div>

      <div class="grid grid-cols-3 gap-5 pt-10">
        @for (p of pagedProducts(); track p.id) {
          <app-product-card
            [productImage]="p.image"
            [productName]="p.name"
            [price]="p.price"
            [productId]="p.id">
          </app-product-card>
        }
      </div>

      <!-- Pagination -->
      @if (totalPages() > 1) {
        <div class="flex justify-center mt-8">
          <app-pagination
            [totalPages]="totalPages()"
            [currentPage]="currentPage()"
            (pageChange)="onPageChange($event)">
          </app-pagination>
        </div>
      }

    </div>

  </div>

</div>

<app-footer></app-footer>
