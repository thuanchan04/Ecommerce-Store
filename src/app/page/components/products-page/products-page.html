<app-header-top class="fixed top-0 left-0 z-50 w-full"></app-header-top>

<!-- mobile: px-4 | tablet: px-8 | desktop: px-10 -->
<div class="px-4 md:px-8 desktop:px-10 min-h-screen">
  <!-- Breadcrumb -->
  <div class="mt-20 px-2 md:px-5 py-6 text-gray-500">
    <a routerLink="/home" class="hover:text-black">Home</a>
    <span> › </span>
    <a routerLink="/products" class="hover:text-black">Catalog</a>
    <span> › </span>
    <span class="text-black font-medium">
      {{ currentCategoryName() }}
    </span>
  </div>

  <!-- Layout: full-width stacked on mobile, 4-col (sidebar+products) on tablet+ -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 px-2 md:px-5 pb-10">

    <!-- LEFT FILTER SIDEBAR: hidden on mobile, visible 1-col on tablet+ -->
    <!-- iPad Mini(768): sidebar ~175px wide — acceptable -->
    <div class="hidden md:block md:col-span-1">
      <app-filter-sidebar
        [filters]="filters"
        [products]="products()"
        (filterChange)="onFilterChange($event)">
      </app-filter-sidebar>
    </div>

    <!-- RIGHT PRODUCTS: full-width on mobile, 3-col on tablet+ -->
    <div class="col-span-1 md:col-span-3">

      <div class="flex justify-between items-center">

        <!-- LEFT -->
        <div class="grid grid-cols-2 gap-0 md:gap-10">
          <p class="text-gray-500">Selected Products:</p>
          <p class="font-bold">{{ filteredProducts().length }}</p>
        </div>

        <!-- RIGHT -->
        <app-drop-down
          [options]="sortOptions"
          [selectedOption]="sortOption()"
          (selectedOptionChange)="onSortChange($event)">
        </app-drop-down>

      </div>

      <!-- 2 cols mobile(360px+) | 2 cols tablet(768px+) | 3 cols desktop(1200px+) -->
      <div class="grid grid-cols-2 desktop:grid-cols-3 gap-5 pt-10">
        @for (p of pagedProducts(); track p.id) {
          <app-product-card
            [productImage]="p.image"
            [productName]="p.name"
            [price]="p.price"
            [productId]="p.id">
          </app-product-card>
        }
      </div>

      <!-- Pagination -->
      @if (totalPages() > 1) {
        <div class="flex justify-center mt-8">
          <app-pagination
            [totalPages]="totalPages()"
            [currentPage]="currentPage()"
            (pageChange)="onPageChange($event)">
          </app-pagination>
        </div>
      }

    </div>

  </div>

</div>

<app-footer></app-footer>
